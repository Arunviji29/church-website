<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grace Community Church | Welcome Home — Sunday Services 9 & 11 AM</title>
    
    <!-- Primary SEO Meta Tags -->
    <meta
      name="description"
      content="Grace Community Church in Springfield, IL — A warm, welcoming family of faith. Join us for Sunday Worship at 9:00 AM & 11:00 AM, Midweek Bible Study, and fellowship in English and Tamil."
    />
    <meta
      name="keywords"
      content="Grace Community Church, Springfield church, Sunday service, Christian fellowship, Tamil church, Tamil Christian fellowship, Bible study, sermons, prayer, Springfield IL"
    />
    <meta name="author" content="Grace Community Church" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1e3a5f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://gracecommunity.church" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grace Community Church" />
    <meta property="og:title" content="Grace Community Church | Welcome Home" />
    <meta
      property="og:description"
      content="A place to belong, believe, and become. Sunday Worship at 9:00 AM & 11:00 AM in-person and streaming live. All are welcome!"
    />
    <meta
      property="og:image"
      content="https://images.pexels.com/photos/29199703/pexels-photo-29199703.jpeg?auto=compress&cs=tinysrgb&w=1200"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@gracecommunity" />
    <meta name="twitter:title" content="Grace Community Church | Welcome Home" />
    <meta
      name="twitter:description"
      content="A place to belong, believe, and become. Sunday Worship at 9:00 AM & 11:00 AM in-person and streaming live. All are welcome!"
    />
    <meta
      name="twitter:image"
      content="https://images.pexels.com/photos/29199703/pexels-photo-29199703.jpeg?auto=compress&cs=tinysrgb&w=1200"
    />

    <!-- Google Fonts: Playfair Display, Inter, and Noto Sans Tamil / Mukta Malar for crisp Tamil rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Mukta+Malar:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Early theme & language initializer to avoid flash -->
    <script>
      (function(){
        try {
          var t = localStorage.getItem('grace-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var l = localStorage.getItem('grace-language');
          if (l === 'ta') {
            document.documentElement.setAttribute('lang', 'ta');
            document.documentElement.classList.add('lang-ta');
          } else {
            document.documentElement.setAttribute('lang', 'en');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
